[package]
name = "llmproxy"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "unified-proxy"
path = "src/bin/unified.rs"

[[bin]]
name = "mock_llm_server"
path = "src/bin/mock_llm_server.rs"
[[bin]]
name = "log_analyzer"
path = "src/bin/log_analyzer.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "http2", "rustls-tls", "trust-dns"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
anyhow = "1"
dashmap = "6"
dotenv = "0.15"
rand = "0.8"
tokio-stream = "0.1"
http-body-util = "0.1"
http-body = "1"
bytes = "1"
async-stream = "0.3"
futures = "0.3"
memchr = "2"
parking_lot = "0.12"
chrono = "0.4"
tiktoken-rs = "0.11.0"

[dev-dependencies]
alloc_counter = "0.0"
criterion = "0.5"

[[bench]]
name = "perf_bench"
harness = false
