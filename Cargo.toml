[package]
name = "llmproxy"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "unified-proxy"
path = "src/bin/unified.rs"

[[bin]]
name = "mock_llm_server"
path = "tests/mock_llm_server.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "http2", "rustls-tls", "trust-dns"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
dashmap = "6"
dotenv = "0.15"
rand = "0.8"

[dev-dependencies]
alloc_counter = "0.0"
criterion = "0.5"

[[bench]]
name = "perf_bench"
harness = false
