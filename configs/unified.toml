type = "unified"
retry = 2
retry_delay_ms = 500

[server]
port = 8090
timeout_secs = 300

[auth]
enabled = true

[[auth.keys]]
key = "sk-proxy-default"
name = "default"
rate_limit = 999

# ─── Fallback 链 ──────────────────────────────────────────

[fallback]
# 高级模型（旗舰）→ 中级 → 低级
"glm-5.1"           = ["gpt-5.5", "claude-opus-4-7"]
"gpt-5.5"           = ["claude-opus-4-7", "glm-5.1"]
"claude-opus-4-7"   = ["gpt-5.5", "glm-5.1"]
# deepseek-v4-pro 已移除：reasoning_content 多轮不兼容无状态 proxy

# 中级模型（均衡）→ 低级
"glm-5-turbo"       = ["glm-5v-turbo", "gpt-5.4"]
"glm-5v-turbo"      = ["glm-5-turbo", "gpt-5.4", "claude-sonnet-4-6"]
"claude-sonnet-4-6" = ["gpt-5.4", "glm-5v-turbo"]
"gpt-5.4"          = ["gpt-5.5", "claude-sonnet-4-6", "glm-5-turbo"]
# deepseek-v4-flash 已移除：reasoning_content 多轮不兼容无状态 proxy

# 低级模型（低成本）→ 兜底
"glm-4.7"        = ["MiniMax-M2.7"]
"MiniMax-M2.7"   = ["MiniMax-M2.7-highspeed", "glm-4.7"]
"MiniMax-M2.7-highspeed" = ["MiniMax-M2.7", "glm-4.7"]

# 兜底
default = ["glm-5.1", "gpt-5.5", "claude-opus-4-7", "glm-5v-turbo", "glm-5-turbo", "claude-sonnet-4-6", "gpt-5.4", "MiniMax-M2.7", "glm-4.7"]


# ─── 模型映射 ────────────────────────────────────────────

[model_mapping]

# 注意：这里不是 fallback 链，而是请求入口的随机模型改写表
# 命中 key 后，会从候选列表中随机选择一个真实模型继续后续路由
# ⚠️ 组内成员必须能力/成本接近，否则同一逻辑模型的实际表现会波动

# 高档（旗舰）≈$5/1M input
#   gpt-5.5           $5/$30  顶级推理
#   claude-opus-4-7   $5/$25  顶级推理，最新版
#   claude-opus-4-6   $5/$25  顶级推理，上一代
#   glm-5.1           智谱内部  旗舰推理
"glm-5.1" = ["gpt-5.5", "claude-opus-4-7", "claude-opus-4-6", "glm-5.1"]

# 中档（均衡）≈$1-3/1M input
#   gpt-5.4           $2.5/$15  强推理
#   gpt-5.2           $1.75/$14  中上推理
#   gpt-5.1           $1.25/$10  中等推理
#   claude-sonnet-4-6 $3/$15     强推理，最新版
#   glm-5-turbo       智谱内部   中等推理
"glm-5-turbo"  = ["gpt-5.4", "gpt-5.2", "gpt-5.1", "claude-sonnet-4-6", "glm-5-turbo"]

# 中档-多模态（视觉+文本）
#   glm-5v-turbo      智谱内部   多模态
#   gpt-5.4           $2.5/$15  多模态+强推理
#   gpt-5.2           $1.75/$14 多模态+中上推理
#   claude-sonnet-4-6 $3/$15    多模态+强推理
"glm-5v-turbo" = ["gpt-5.4", "gpt-5.2", "gpt-5.1", "claude-sonnet-4-6", "glm-5v-turbo"]

# 低档（经济）≈$0.05-1/1M input
#   claude-haiku-4-5-20251001  $1/$5    便宜强推理+多模态
#   gpt-5-mini                $0.25/$2  经济型
#   MiniMax-M2.7              免费档    经济型
#   MiniMax-M2.7-highspeed    免费档    高速经济
#   MiniMax-M2.5              免费档    经济型
#   MiniMax-M2.5-highspeed    免费档    高速经济
#   glm-4.7                   智谱内部  经济加速
#   glm-4.6                   智谱内部  极速加速
"glm-4.7" = ["claude-haiku-4-5-20251001", "gpt-5-mini", "MiniMax-M2.7", "MiniMax-M2.7-highspeed", "MiniMax-M2.5", "MiniMax-M2.5-highspeed", "glm-4.7", "glm-4.6"]

# ─── OpenAI 后端 ───────────────────────────────────────────

# 智谱后端：支持所有GLM模型
[[backends]]
name = "zhipu-openai"
url = "https://open.bigmodel.cn/api/coding/paas"
api_key = "${ZHIPU_API_KEY}"
weight = 10
models = ["glm-5.1", "glm-5v-turbo", "glm-5-turbo", "glm-4.7", "glm-4.6"]
timeout_secs = 300
connect_timeout_secs = 10
protocol = "openai"

# MiniMax后端1（MINIMAX_API_KEY_1 支持 highspeed）
[[backends]]
name = "minimax-coding-1"
url = "https://api.minimaxi.com"
api_key = "${MINIMAX_API_KEY_1}"
weight = 10
models = ["MiniMax-M2.7", "MiniMax-M2.7-highspeed", "MiniMax-M2.5", "MiniMax-M2.5-highspeed"]
timeout_secs = 300
connect_timeout_secs = 8
protocol = "openai"

# MiniMax后端2（MINIMAX_API_KEY_2 不支持 highspeed）
[[backends]]
name = "minimax-coding-2"
url = "https://api.minimaxi.com"
api_key = "${MINIMAX_API_KEY_2}"
weight = 10
models = ["MiniMax-M2.7", "MiniMax-M2.5"]
timeout_secs = 300
connect_timeout_secs = 8
protocol = "openai"

# Guidor后端：Claude系列
[[backends]]
name = "guidor"
url = "https://guidor.vip"
api_key = "${GUIDOR_API_KEY}"
weight = 10
models = ["claude-opus-4-7", "claude-opus-4-6", "claude-sonnet-4-6", "claude-haiku-4-5-20251001"]
timeout_secs = 300
connect_timeout_secs = 8
protocol = "openai"

# Guidor后端：GPT系列
[[backends]]
name = "guidor-gpt"
url = "https://guidor.vip"
api_key = "${GUIDOR_GPT_API_KEY}"
weight = 10
models = ["gpt-5.5", "gpt-5.4", "gpt-5.2", "gpt-5.1", "gpt-5-mini"]
timeout_secs = 300
connect_timeout_secs = 8
protocol = "openai"
strip_params = ["thinking"]

# Guidor后端：DeepSeek系列（已禁用：reasoning_content 多轮不兼容无状态 proxy）
