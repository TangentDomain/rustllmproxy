# ─── Anthropic 后端 ─────────────────────────────────────────

# 智谱 Anthropic 后端：GLM 系列
[[backends]]
name = "zhipu-anthropic"
url = "https://open.bigmodel.cn/api/anthropic"
api_key = "${ZHIPU_API_KEY}"
weight = 10
models = ["glm-5.1", "glm-5v-turbo", "glm-5-turbo", "glm-4.7", "glm-4.6"]
timeout_secs = 300
connect_timeout_secs = 10
protocol = "anthropic"

# MiniMax后端1（MINIMAX_API_KEY_1 支持 highspeed）
[[backends]]
name = "minimax-anthropic-1"
url = "https://api.minimaxi.com/anthropic"
api_key = "${MINIMAX_API_KEY_1}"
weight = 10
models = ["MiniMax-M2.7", "MiniMax-M2.7-highspeed", "MiniMax-M2.5", "MiniMax-M2.5-highspeed"]
timeout_secs = 300
connect_timeout_secs = 8
protocol = "anthropic"
strip_params = ["metadata", "service_tier", "thinking"]

# MiniMax后端2（MINIMAX_API_KEY_2 不支持 highspeed）
[[backends]]
name = "minimax-anthropic-2"
url = "https://api.minimaxi.com/anthropic"
api_key = "${MINIMAX_API_KEY_2}"
weight = 10
models = ["MiniMax-M2.7", "MiniMax-M2.5"]
timeout_secs = 300
connect_timeout_secs = 8
protocol = "anthropic"
strip_params = ["metadata", "service_tier", "thinking"]
