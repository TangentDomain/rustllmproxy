type = "unified"
retry = 2
retry_delay_ms = 500

[server]
port = 8090
timeout_secs = 300

[auth]
enabled = true

[[auth.keys]]
key = "sk-proxy-default"
name = "default"
rate_limit = 999

# ─── Fallback 链 ──────────────────────────────────────────

[fallback]
# 高级模型（旗舰）→ 中级 → 低级
"glm-5.1"           = ["gpt-5.5", "claude-opus-4-7", "deepseek-v4-pro"]
"gpt-5.5"           = ["claude-opus-4-7", "glm-5.1", "deepseek-v4-pro"]
"claude-opus-4-7"   = ["gpt-5.5", "glm-5.1", "deepseek-v4-pro"]
"deepseek-v4-pro"   = ["glm-5.1", "gpt-5.5", "claude-opus-4-7"]

# 中级模型（均衡）→ 低级
"glm-5-turbo"       = ["glm-5v-turbo", "gpt-5.4", "deepseek-v4-flash"]
"glm-5v-turbo"      = ["glm-5-turbo", "gpt-5.4", "claude-sonnet-4-6"]
"claude-sonnet-4-6" = ["gpt-5.4", "glm-5v-turbo", "deepseek-v4-flash"]
"gpt-5.4"          = ["gpt-5.5", "claude-sonnet-4-6", "glm-5-turbo"]
"deepseek-v4-flash" = ["gpt-5.4", "glm-5-turbo", "MiniMax-M2.7"]

# 低级模型（低成本）→ 兜底
"glm-4.7"        = ["MiniMax-M2.7", "deepseek-v4-flash"]
"MiniMax-M2.7"   = ["MiniMax-M2.7-highspeed", "glm-4.7", "deepseek-v4-flash"]
"MiniMax-M2.7-highspeed" = ["MiniMax-M2.7", "glm-4.7"]

# 兜底
default = ["glm-5.1", "gpt-5.5", "claude-opus-4-7", "deepseek-v4-pro", "glm-5v-turbo", "glm-5-turbo", "claude-sonnet-4-6", "gpt-5.4", "deepseek-v4-flash", "MiniMax-M2.7", "glm-4.7"]


# ─── 模型映射 ────────────────────────────────────────────

[model_mapping]

# 高级模型：旗舰级
"glm-5.1" = ["gpt-5.5", "claude-opus-4-7", "deepseek-v4-pro"]

# 中级模型：均衡性能
"glm-5-turbo" = ["gpt-5.4", "deepseek-v4-flash"]

# 多模态模型：视觉/多模态
"glm-5v-turbo" = ["claude-sonnet-4-6"]

# 轻量模型：快速便宜
"glm-4.7" = ["MiniMax-M2.7", "MiniMax-M2.7-highspeed", "deepseek-v4-flash"]

# ─── OpenAI 后端 ───────────────────────────────────────────

# 智谱后端：支持所有GLM模型
[[backends]]
name = "zhipu-openai"
url = "https://open.bigmodel.cn/api/coding/paas"
api_key = "${ZHIPU_API_KEY}"
weight = 10
models = ["glm-5.1", "glm-5v-turbo", "glm-5-turbo", "glm-4.7"]
timeout_secs = 300
connect_timeout_secs = 10
protocol = "openai"

# MiniMax后端1（两个key负载均衡）
[[backends]]
name = "minimax-coding-1"
url = "https://api.minimaxi.com"
api_key = "${MINIMAX_API_KEY_1}"
weight = 10
models = ["MiniMax-M2.7", "MiniMax-M2.7-highspeed"]
timeout_secs = 300
connect_timeout_secs = 8
protocol = "openai"

[[backends]]
name = "minimax-coding-2"
url = "https://api.minimaxi.com"
api_key = "${MINIMAX_API_KEY_2}"
weight = 10
models = ["MiniMax-M2.7"]
timeout_secs = 300
connect_timeout_secs = 8
protocol = "openai"

# Guidor后端：Claude系列
[[backends]]
name = "guidor"
url = "https://guidor.vip"
api_key = "${GUIDOR_API_KEY}"
weight = 10
models = ["claude-opus-4-7", "claude-sonnet-4-6", "claude-haiku-4-5"]
timeout_secs = 300
connect_timeout_secs = 8
protocol = "openai"

# Guidor后端：GPT系列
[[backends]]
name = "guidor-gpt"
url = "https://guidor.vip"
api_key = "${GUIDOR_GPT_API_KEY}"
weight = 10
models = ["gpt-5.5", "gpt-5.4"]
timeout_secs = 300
connect_timeout_secs = 8
protocol = "openai"

# Guidor后端：DeepSeek系列
[[backends]]
name = "guidor-deepseek"
url = "https://guidor.vip"
api_key = "${GUIDOR_DEEPSEEK_API_KEY}"
weight = 10
models = ["deepseek-v4-pro", "deepseek-v4-flash"]
timeout_secs = 300
connect_timeout_secs = 8
protocol = "openai"

# ─── Anthropic 后端 ─────────────────────────────────────────

# 智谱 Anthropic 后端：GLM 系列
[[backends]]
name = "zhipu-anthropic"
url = "https://open.bigmodel.cn/api/anthropic"
api_key = "${ZHIPU_API_KEY}"
weight = 10
models = ["glm-5.1", "glm-5v-turbo", "glm-5-turbo", "glm-4.7"]
timeout_secs = 300
connect_timeout_secs = 10
protocol = "anthropic"

# MiniMax后端1（两个key负载均衡）
[[backends]]
name = "minimax-anthropic-1"
url = "https://api.minimaxi.com/anthropic"
api_key = "${MINIMAX_API_KEY_1}"
weight = 10
models = ["MiniMax-M2.7", "MiniMax-M2.7-highspeed"]
timeout_secs = 300
connect_timeout_secs = 8
protocol = "anthropic"

[[backends]]
name = "minimax-anthropic-2"
url = "https://api.minimaxi.com/anthropic"
api_key = "${MINIMAX_API_KEY_2}"
weight = 10
models = ["MiniMax-M2.7"]
timeout_secs = 300
connect_timeout_secs = 8
protocol = "anthropic"
