type = "anthropic"
retry = 2
retry_delay_ms = 500

[server]
port = 8092
timeout_secs = 300

[auth]
enabled = true

[[auth.keys]]
key = "sk-proxy-default"
name = "default"
rate_limit = 60

# ─── Fallback 链 ──────────────────────────────────────────

[fallback]
# 旗舰模型
"glm-5.1"      = ["glm-5v-turbo", "glm-5-turbo", "MiniMax-M2.7", "glm-4.7", "MiniMax-M2.5", "glm-4.6"]
"glm-5v-turbo" = ["glm-5-turbo", "glm-5.1", "MiniMax-M2.7", "glm-4.7", "MiniMax-M2.5"]
"glm-5-turbo"  = ["glm-5v-turbo", "glm-5.1", "MiniMax-M2.7", "glm-4.7", "MiniMax-M2.5"]

# 中端模型
"glm-4.7"      = ["MiniMax-M2.7", "glm-4.6", "glm-4.5", "MiniMax-M2.5", "glm-4.5-air"]

# 轻量模型
"glm-4.6"      = ["glm-4.7", "MiniMax-M2.7", "MiniMax-M2.5", "glm-4.5"]
"glm-4.5"      = ["glm-4.6", "glm-4.7", "MiniMax-M2.7", "MiniMax-M2.5"]
"glm-4.5-air"  = ["glm-4.5", "glm-4.6", "glm-4.7"]

# MiniMax模型
"MiniMax-M2.7"  = ["MiniMax-M2.5", "glm-4.7", "glm-4.6", "glm-5v-turbo"]
"MiniMax-M2.5"  = ["MiniMax-M2.7", "glm-4.7", "glm-4.6"]

# 兜底
default          = ["glm-5.1", "glm-5v-turbo", "glm-5-turbo", "glm-4.7", "MiniMax-M2.7", "MiniMax-M2.5", "glm-4.6", "glm-4.5", "glm-4.5-air"]

# ─── 后端 ──────────────────────────────────────────────

# 智谱 Anthropic 后端：GLM 系列
[[backends]]
name = "zhipu-anthropic"
url = "https://open.bigmodel.cn/api/anthropic"
api_key = "YOUR_ZHIPU_API_KEY_HERE"
weight = 10
models = ["glm-5.1", "glm-5v-turbo", "glm-5-turbo", "glm-5", "glm-4.7", "glm-4.6", "glm-4.5", "glm-4.5-air"]
timeout_secs = 300
connect_timeout_secs = 10

# MiniMax后端1（两个key负载均衡）
[[backends]]
name = "minimax-coding-1"
url = "https://api.minimaxi.com/anthropic"
api_key = "YOUR_MINIMAX_API_KEY_1_HERE"
weight = 10
models = ["MiniMax-M2.7", "MiniMax-M2.5"]
timeout_secs = 300
connect_timeout_secs = 8

[[backends]]
name = "minimax-coding-2"
url = "https://api.minimaxi.com/anthropic"
api_key = "YOUR_MINIMAX_API_KEY_2_HERE"
weight = 10
models = ["MiniMax-M2.7", "MiniMax-M2.5"]
timeout_secs = 300
connect_timeout_secs = 8
